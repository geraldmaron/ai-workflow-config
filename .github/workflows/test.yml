name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Lint the skills library
        run: scripts/skills lint
      - name: Safety tests
        run: tests/run-tests.sh
      - name: Install dry run on a clean home
        run: HOME="$(mktemp -d)" ./install --dry-run --no-method-layer
